# apiVersion: v1
# kind: ConfigMap
# metadata:
#   name: frontend
#   namespace: roboshop
#   labels:
#     component: frontend
#     project: roboshop
#     tier: web
# data:
#   CART_ENDPOINT: "cart:8080"
#   DB_HOST: "mysql"
---
apiVersion: webs/v1
kind: Deployment
metadata: 
  name: frontend
  namespace: roboshop
  labels:
    component: frontend
    project: roboshop
    tier: web
spec:
  replicas: 1

  # These are the labels for replica set use to create pod replicas, this should match pod labels 
  selector:
    matchLabels:
      component: frontend
      project: roboshop
      tier: web
  # This is pod defination
  template:
    metadata:
      labels:
        component: frontend
        project: roboshop
        tier: web
    spec:
      containers:
      - name: frontend
        image: joindevops/frontend:v1
        # envFrom:
        # - configMapRef:
        #     name: frontend
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: roboshop
  labels:
    component: frontend
    project: roboshop
    tier: web
spec:
  type: LoadBalancer
  selector:
    component: frontend
    project: roboshop
    tier: web
  ports:
  - protocol: TCP
    port: 80  #service port
    targetPort: 80 # container port
        
